name: Build PR test artifacts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate source and manifests
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Chrome and Firefox
        run: npm run build
      - name: Verify release parity
        run: npm run verify:release-parity
      - name: Lint Firefox
        run: npm run lint:firefox
      - name: Upload Chrome test build
        uses: actions/upload-artifact@v7
        with:
          name: rule34video-media-filter-chrome-pr
          path: dist/chrome
          retention-days: 14
          if-no-files-found: error
      - name: Upload Firefox test build
        uses: actions/upload-artifact@v7
        with:
          name: rule34video-media-filter-firefox-pr
          path: dist/firefox
          retention-days: 14
          if-no-files-found: error
