name: Verify extension

on:
  push:
    branches:
      - main
      - "assistant/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate source and manifests
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build Chrome and Firefox packages
        run: npm run build

      - name: Verify Chrome and Firefox release parity
        run: npm run verify:release-parity

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Upload Chrome test build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rule34video-media-filter-chrome
          path: dist/chrome/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox test build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rule34video-media-filter-firefox
          path: dist/firefox/
          if-no-files-found: error
          retention-days: 14
